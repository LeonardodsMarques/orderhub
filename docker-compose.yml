services:
  postgres:
    image: postgres:16
    container_name: orderhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: orderhub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  orderservice:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    container_name: orderhub-orderservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 5001
      ConnectionStrings__Postgres: "Host=postgres;Database=orderhub;Username=postgres;Password=postgres"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  notificationservice:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    container_name: orderhub-notificationservice
    environment:
      PORT: 5002
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "5002:5002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  inventoryservice:
    build:
      context: .
      dockerfile: src/InventoryService/Dockerfile
    container_name: orderhub-inventoryservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 5003
      ConnectionStrings__Postgres: "Host=postgres;Database=inventory;Username=postgres;Password=postgres"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    container_name: orderhub-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 5000
      ReverseProxy__Clusters__orderservice__Destinations__destination1__Address: "http://orderservice:5001"
      ReverseProxy__Clusters__notificationservice__Destinations__destination1__Address: "http://notificationservice:5002"
      ReverseProxy__Clusters__inventoryservice__Destinations__destination1__Address: "http://inventoryservice:5003"
    ports:
      - "5000:5000"
    depends_on:
      orderservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
      inventoryservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: orderhub-frontend
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres_data:
